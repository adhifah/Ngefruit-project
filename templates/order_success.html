<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesanan Berhasil</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body class="order-success-page">
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">
        <a href="{{ url_for('home') }}" class="logo-link">
          <img src="/static/images/logobrand.png" class="logo-img" />
          NGEFRUIT
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/produk">Menu</a></li>
        <li><a href="/#order">Order</a></li>
      </ul>
    </nav>

    <!-- THANK YOU GIF -->
    <div
      id="loadingGif"
      class="gif-wrapper"
      style="
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <img src="/static/images/thanks.gif" alt="Thanks" class="gif-img" />
    </div>

    <!-- STRUK PAGE -->
    <section class="success-wrapper" id="strukBox" style="display: none">
      <div
        class="success-container"
        style="
          width: 330px;
          margin: 30px auto;
          background: white;
          padding: 20px;
          border: 1px solid #ddd;
          font-family: 'Courier New', monospace;
          text-align: left;
        "
      >
        <h3 style="text-align: center; margin: 0; font-weight: bold">
          NGEFRUIT
        </h3>
        <p style="text-align: center; margin: 5px 0 15px; font-size: 13px">
          STRUK PEMBELIAN
        </p>

        <p>Tanggal : {{ tanggal }}</p>
        <hr />
        <p>Nama : {{ nama }}</p>
        <p>Produk : {{ produk_nama }}</p>
        <p>Jumlah : {{ jumlah }} pcs</p>
        <p>Harga Satuan : Rp {{ harga }}</p>
        <p>Total : Rp {{ total }}</p>
        <hr />

        <p style="text-align: center; font-size: 13px">
          TERIMA KASIH TELAH BERBELANJA!
        </p>

        <div style="text-align: center; margin-top: 10px">
          <a
            href="/"
            style="
              text-decoration: none;
              font-size: 13px;
              border: 1px solid #000;
              padding: 5px 10px;
              display: inline-block;
              margin-top: 10px;
              color: black;
            "
          >
            Kembali
          </a>

          <a
            href="https://wa.me/6285133796127?text=Halo%20Kak,%20saya%20sudah%20melakukan%20pembelian%20di%20website%20Ngefruit.%0A%0ADetail%20pesanan:%0A- Nama:%20{{ nama }}%0A- Produk:%20{{ produk_nama }}%0A- Jumlah:%20{{ jumlah }}%20pcs%0A- Total:%20Rp%20{{ total }}%0A- Tanggal:%20{{ tanggal }}%0A%0ASaya%20ingin%20klaim%20stiker/stempel%20digital%20ya%20🥰"
            target="_blank"
            style="
              text-decoration: none;
              font-size: 13px;
              border: 1px solid #000;
              padding: 5px 10px;
              display: inline-block;
              margin-top: 10px;
              color: white;
              background: #25d366;
            "
          >
            Klaim Stiker via WhatsApp
          </a>
        </div>
      </div>
    </section>

    <!-- SCRIPT -->
    <script>
      setTimeout(() => {
        document.getElementById("loadingGif").style.display = "none";
        document.getElementById("strukBox").style.display = "block";
      }, 2500);
    </script>
  </body>
</html>
